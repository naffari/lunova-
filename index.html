<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunova Services | Cleaning, Junk Removal & Landscaping in KC</title>
    <meta name="description" content="Lunova Services offers professional cleaning, junk removal, and landscaping solutions in the Kansas City metro area." />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!--
      Typefaces are self-hosted from /public/fonts (see src/styles/fonts.css for
      the @font-face blocks and why they left Google Fonts). Preloading the two
      latin files here means they are in flight alongside the stylesheet rather
      than discovered after it parses, so the display face is usually ready for
      first paint and never swaps in late under the headings.

      `crossorigin` is required on font preloads even same-origin — without it
      the browser fetches the file twice and the preload does nothing.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plus-jakarta-sans-latin-400-800-normal.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/instrument-serif-latin-400-normal.woff2">

    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
      .font-serif-display { font-family: 'Instrument Serif', Georgia, serif; }
      .font-sans-modern { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
  </head>

  <body class="font-sans-modern">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
